server {
    listen 80;
    listen [::]:80;
    server_name admin.beachlab.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://admin.beachlab.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.beachlab.org;
    ssl_certificate /etc/letsencrypt/live/admin.beachlab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.beachlab.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/authentik-outpost.conf;
    client_max_body_size 2k;
    location / {
        include /etc/nginx/snippets/authentik-check.conf;
        auth_request_set $admin_username $upstream_http_x_authentik_username;
        proxy_set_header X-Authentik-Username $admin_username;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://unix:/run/beachlab-admin/http.sock:;
        proxy_read_timeout 180s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
}
