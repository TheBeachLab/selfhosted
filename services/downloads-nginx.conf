# Install as /etc/nginx/snippets/downloads.conf inside beachlab.org HTTPS server.
location = /drop { return 301 /drop/; }
location = /downloads { return 301 /downloads/; }
location ^~ /downloads/ {
    if ($host != beachlab.org) { return 301 https://beachlab.org$request_uri; }
    include /etc/nginx/snippets/authentik-check.conf;
    proxy_pass http://unix:/run/url-drop/url-drop.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
# Preserve previous Drop links and API paths.
location ^~ /drop/ {
    if ($host != beachlab.org) { return 301 https://beachlab.org$request_uri; }
    include /etc/nginx/snippets/authentik-check.conf;
    proxy_pass http://unix:/run/url-drop/url-drop.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
}
location ^~ /drop-internal/ {
    internal;
    alias /home/pink/downloads/;
    disable_symlinks on;
    add_header Content-Security-Policy "sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
}
