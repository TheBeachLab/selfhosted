# All UI, API, originals and reports are owner-only, via existing passkey flow.
# https://docs.goauthentik.io/add-secure-apps/providers/proxy/server_nginx/
map "$request_method:$http_origin" $buchhaltung_bad_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^(POST|PUT|PATCH|DELETE):https://buchhaltung\.beachlab\.org$ 0;
}
map "$request_method:$http_sec_fetch_site" $buchhaltung_bad_fetch {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):(cross-site|same-site)$ 1;
}
server {
    listen 80;
    listen [::]:80;
    server_name buchhaltung.beachlab.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://buchhaltung.beachlab.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name buchhaltung.beachlab.org;
    ssl_certificate /etc/letsencrypt/live/buchhaltung.beachlab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buchhaltung.beachlab.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/authentik-outpost.conf;
    client_max_body_size 25m;

    location / {
        if ($buchhaltung_bad_origin) { return 403; }
        if ($buchhaltung_bad_fetch) { return 403; }
        include /etc/nginx/snippets/authentik-check.conf;
        auth_request_set $buchhaltung_username $upstream_http_x_authentik_username;
        proxy_set_header X-Authentik-Username $buchhaltung_username;
        include /etc/nginx/snippets/buchhaltung-proxy-secret.conf;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host buchhaltung.beachlab.org;
        proxy_set_header X-Forwarded-Host buchhaltung.beachlab.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
