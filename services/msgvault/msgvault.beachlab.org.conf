# Forward auth: https://docs.goauthentik.io/add-secure-apps/providers/proxy/server_nginx/
# The backend treats an injected API key as explicit authentication; enforce
# browser mutation origins here, before adding that credential:
# https://github.com/kenn-io/msgvault/blob/v0.21.0/internal/api/csrf.go
map "$request_method:$http_origin" $msgvault_bad_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^(POST|PUT|PATCH|DELETE):$ 0;
    ~^(POST|PUT|PATCH|DELETE):https://msgvault\.beachlab\.org$ 0;
}
map "$request_method:$http_sec_fetch_site" $msgvault_bad_fetch {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):(cross-site|same-site)$ 1;
}
server {
    listen 80;
    listen [::]:80;
    server_name msgvault.beachlab.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://msgvault.beachlab.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name msgvault.beachlab.org;
    ssl_certificate /etc/letsencrypt/live/msgvault.beachlab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msgvault.beachlab.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/authentik-outpost.conf;
    client_max_body_size 64m;

    location / {
        if ($msgvault_bad_origin) { return 403; }
        if ($msgvault_bad_fetch) { return 403; }
        include /etc/nginx/snippets/authentik-check.conf;
        include /etc/nginx/snippets/msgvault-api-key.conf;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host msgvault.beachlab.org;
        proxy_set_header X-Forwarded-Host msgvault.beachlab.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control no-store always;
    }
}
