# Include inside the arroyo.ing TLS server. Public root is a validated release.
location = /podcast { return 301 /podcast/; }
location /podcast/ {
    alias /var/www/podcast/current/;
    index index.html;
    autoindex off;
    types {
        text/html html;
        application/rss+xml xml;
        audio/mpeg mp3;
        audio/mp4 m4a;
        video/mp4 mp4;
        image/jpeg jpg jpeg;
        image/png png;
        text/plain txt;
        text/vtt vtt;
    }
    default_type application/octet-stream;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag noindex always;
    limit_except GET HEAD { deny all; }
}
