<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>$title — Podcast mit Fran</title>
<meta name="description" content="$description">
<link rel="canonical" href="$base_url">
<link rel="alternate" type="application/rss+xml" title="$title" href="feed.xml">
<meta property="og:type" content="website">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:url" content="$base_url">
$og_image
<style>
:root{color-scheme:light;--paper:#fff;--ink:#1d1d1f;--muted:#73737a;--line:#e8e8ed;font-family:Arial,Helvetica,sans-serif;font-synthesis:none}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--paper);color:var(--ink)}a{color:inherit;text-underline-offset:4px}a:focus-visible{outline:2px solid currentColor;outline-offset:6px}.container{width:87.8%;max-width:1120px;margin-inline:auto}.site-header{height:clamp(64px,6.5vw,96px);display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:clamp(16px,1.9vw,28px);white-space:nowrap;text-decoration:none}.wordmark{font-size:clamp(23px,2.1vw,31px);letter-spacing:-1.2px;font-weight:500;line-height:1}nav{font-size:14px}nav a{text-decoration:none;padding-block:12px}.skip{position:absolute;left:16px;top:-80px;padding:12px;background:white;z-index:3}.skip:focus{top:10px}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(32px,4vw,64px);padding-block:60px 64px}.cover{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;border-radius:6%}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(38px,4.4vw,64px);font-weight:400;line-height:1.04;letter-spacing:-1.8px;margin:0 0 16px}.host{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.2;margin:0 0 28px}.description{font-size:20px;line-height:1.55;margin:0 0 24px;max-width:30em}.format{font-size:13px;line-height:1.7;color:#626267;border-top:1px solid var(--line);padding-top:20px;margin:0 0 24px}.button{display:inline-flex;align-items:center;gap:20px;min-height:48px;padding:14px 22px;background:var(--ink);color:white;text-decoration:none;font-size:15px}.button:hover{background:#414145}.button svg{width:17px;height:17px}.episodes{border-top:1px solid var(--line);padding-block:40px 56px;scroll-margin-top:24px}.episode{display:grid;grid-template-columns:27% 1fr;gap:40px}.episode-status{font-size:14px;color:#626267;margin:0;line-height:1.7}.episode-copy{border-left:1px solid var(--line);padding-left:40px}.episode h2{font:400 clamp(28px,3vw,38px)/1.15 Georgia,'Times New Roman',serif;letter-spacing:-.6px;margin:0 0 20px;max-width:22em}.episode p:not(.episode-status){font-size:17px;line-height:1.6;margin:0 0 14px;max-width:42em}.published article{padding-block:28px;border-bottom:1px solid var(--line)}audio{width:100%;margin:16px 0}.site-footer{border-top:1px solid var(--line);padding-block:24px 36px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:12px;color:#626267}.footer-links{display:flex;gap:24px;flex-wrap:wrap}.site-footer a{text-decoration:none}.site-footer a:hover{text-decoration:underline}
@media(max-width:700px){.container{width:88%}.site-header{height:72px;gap:16px}.brand{gap:0}.wordmark{font-size:28px}.hero{grid-template-columns:1fr;gap:32px;padding-block:32px 40px}.hero h1{font-size:clamp(38px,9vw,54px);letter-spacing:-1px}.host{font-size:25px;margin-bottom:20px}.description{font-size:18px}.format{font-size:12px}.episode{grid-template-columns:1fr;gap:20px}.episode-copy{padding-left:0;border:0}.episodes{padding-block:30px 36px}.episode h2{font-size:31px}.site-footer{gap:20px}.footer-links{gap:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main-content">Zum Inhalt</a>
<header class="site-header container">
<a class="brand" href="/" aria-label="Arroyo Bauingenieurbüro – Startseite"><span class="wordmark">arroyo</span></a>
<nav aria-label="Hauptnavigation"><a href="#folgen">Folgen</a></nav>
</header>
<main class="container" id="main-content">
<section class="hero" aria-labelledby="show-title">
$cover_image
<div class="hero-copy"><h1 id="show-title">$display_title</h1><p class="host">mit Fran</p><p class="description">$description</p><p class="format">Jeden Dienstag</p><a class="button" href="#folgen">Zur ersten Folge <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></a></div>
</section>
<section class="episodes" id="folgen" aria-label="Folgen">$episodes</section>
</main>
<footer class="site-footer container"><div class="footer-links"><a href="/">Arroyo</a><a href="https://orbita.arroyo.ing/">Orbita</a><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a></div><a href="feed.xml">RSS-Feed</a></footer>
</body></html>
