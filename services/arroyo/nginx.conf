server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arroyo.ing www.arroyo.ing;
    root /var/www/arroyo.ing;
    index index.html;
    access_log off;
    error_log /dev/null crit;
    ssl_certificate /etc/letsencrypt/live/arroyo.ing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arroyo.ing/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/housing-podcast.conf;
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    listen [::]:80;
    server_name arroyo.ing www.arroyo.ing;
    access_log off;
    error_log /dev/null crit;
    return 301 https://$host$request_uri;
}
