# Included only in api.beachlab.org's existing HTTPS server.
# Preserve encoded CouchDB document IDs with the upstream's subdirectory recipe:
# https://github.com/vrtmrz/obsidian-livesync/blob/1.0.38/docs/setup_own_server.md#nginx
location = /obsidian-sync { return 308 /obsidian-sync/; }
location ^~ /obsidian-sync/ {
    rewrite ^ $request_uri;
    rewrite ^/obsidian-sync/(.*) /$1 break;
    proxy_pass http://127.0.0.1:15984$uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 50m;
    access_log off;
}
