# https://nginx.org/en/docs/http/ngx_http_log_module.html
# URI only: never log confirmation tokens, email bodies, referers or user agents.
log_format mebuko_privacy '$remote_addr [$time_iso8601] "$request_method $uri" $status';
limit_req_zone $binary_remote_addr zone=mebuko_form:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mebuko.de www.mebuko.de;
    access_log /var/log/nginx/mebuko-access.log mebuko_privacy;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://mebuko.de$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mebuko.de;
    ssl_certificate /etc/letsencrypt/live/mebuko.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mebuko.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/mebuko-access.log mebuko_privacy;
    error_log /dev/null crit;
    return 301 https://mebuko.de$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mebuko.de;
    ssl_certificate /etc/letsencrypt/live/mebuko.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mebuko.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 2k;
    access_log /var/log/nginx/mebuko-access.log mebuko_privacy;
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location /api/ {
        limit_req zone=mebuko_form burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host mebuko.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
        proxy_read_timeout 35s;
    }
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host mebuko.de;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization "";
    }
}
