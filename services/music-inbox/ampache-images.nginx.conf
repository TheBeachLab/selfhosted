# Include inside the Nextcloud server block BEFORE its PHP regex location.
# Amperfy 2.1.1 uses session auth on image.php; Music 3.2.1 requires an
# image-specific token there. Route only legacy session requests to get_art.
location ~ ^/(?:index[.]php/)?apps/music/ampache/image[.]php$ {
    if ($arg_token != "") { rewrite ^ /index.php last; }
    if ($arg_auth = "") { rewrite ^ /index.php last; }

    set $music_image_args "action=get_art&id=$arg_object_id&type=$arg_object_type&auth=$arg_auth&size=$arg_size";
    include fastcgi_params;
    # Nextcloud routes on REQUEST_URI, so a rewrite alone is insufficient.
    fastcgi_param REQUEST_URI /index.php/apps/music/ampache/server/xml.server.php?$music_image_args;
    fastcgi_param QUERY_STRING $music_image_args;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param PATH_INFO /apps/music/ampache/server/xml.server.php;
    fastcgi_param HTTPS on;
    fastcgi_param modHeadersAvailable true;
    fastcgi_param front_controller_active true;
    fastcgi_pass php-handler;
    fastcgi_intercept_errors on;
    fastcgi_request_buffering off;
}
