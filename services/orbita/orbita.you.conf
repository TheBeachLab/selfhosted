server {
    listen 80;
    server_name orbita.you www.orbita.you;
    return 308 https://orbita.arroyo.ing$request_uri;
}

server {
    listen 443 ssl;
    server_name orbita.you www.orbita.you;
    ssl_certificate /etc/letsencrypt/live/orbita.you/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbita.you/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://orbita.arroyo.ing$request_uri;
}
