server {
    listen 80;
    server_name orbita.arroyo.ing;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://orbita.arroyo.ing$request_uri; }
}

server {
    listen 443 ssl;
    server_name orbita.arroyo.ing;

    ssl_certificate     /etc/letsencrypt/live/orbita.arroyo.ing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbita.arroyo.ing/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Rewrite the published site's canonical, language and sitemap URLs.
    sub_filter 'https://orbita.you' 'https://orbita.arroyo.ing';
    sub_filter '0x4AAAAAACoq_KOQ8JqIIJa2' '0x4AAAAAAFi6ab4NcJ-j-TaW';
    sub_filter_once off;
    sub_filter_types application/xml text/xml text/plain application/javascript text/javascript;
    root /var/www/orbita.you;
    index index.html;

    # Static site
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

          # PostgREST API for orbita
    # Rate-limited API writes (waitlist, etc.)
    location = /api/store_waitlist {
        limit_req zone=api_writes burst=3 nodelay;
        limit_req_status 429;

        set $auth_header "";
        if ($http_cookie ~* "orbita_token=([^;]+)") {
            set $auth_header "Bearer $1";
        }

        proxy_pass http://127.0.0.1:3011/store_waitlist;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $auth_header;
    }
      location /api/ {
          # Convert cookie to Authorization header for PostgREST
          set $auth_header "";
          if ($http_cookie ~* "orbita_token=([^;]+)") {
              set $auth_header "Bearer $1";
          }

          proxy_pass http://127.0.0.1:3011/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $auth_header;
      }

    # Auth API
    location /auth/ {
        proxy_pass http://127.0.0.1:8100/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Image upload
    location /upload/ {
        proxy_pass http://127.0.0.1:8100/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;
    }

    # Uploaded images (static)
    location /uploads/ {
        alias /var/www/orbita/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
