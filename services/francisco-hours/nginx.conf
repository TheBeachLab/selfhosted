# Include in the existing daswerklab.de HTTPS server. Exact match takes priority
# over the existing /voice/ prefix without restarting the voice service.
location = /voice/business-hours {
    proxy_pass http://127.0.0.1:18092/business-hours;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_cache off;
    access_log off;
    limit_except GET { deny all; }
}
