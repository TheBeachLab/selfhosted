# Include only in protected locations (or entirely private server blocks).
# Source: https://docs.goauthentik.io/add-secure-apps/providers/proxy/server_nginx/
# The same Nginx server also serves www; use the registered provider host.
if ($host = www.beachlab.org) { return 302 https://beachlab.org$request_uri; }
auth_request /outpost.goauthentik.io/auth/nginx;
error_page 401 = @authentik_signin;
auth_request_set $authentik_cookie $upstream_http_set_cookie;
add_header Set-Cookie $authentik_cookie always;
