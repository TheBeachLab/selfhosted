# https://github.com/dani-garcia/vaultwarden/wiki/Proxy-examples#nginx-by-blackdex
map $http_upgrade $vaultwarden_connection_upgrade {
    default upgrade;
    '' '';
}
server {
    listen 80;
    listen [::]:80;
    server_name passwords.beachlab.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://passwords.beachlab.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name passwords.beachlab.org;
    ssl_certificate /etc/letsencrypt/live/passwords.beachlab.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passwords.beachlab.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 64m;
    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    # Native SSO enforces Authentik's passkey flow. Interactive forward-auth
    # redirects on API routes would prevent Bitwarden apps from connecting.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host passwords.beachlab.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vaultwarden_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
